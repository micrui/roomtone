[project]
name = "roomtone"
version = "0.1.0"
description = "Room-responsive ambient music: listens to a room, locks onto its own output, steers a Dirtywave M8 through TidalCycles."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "python-osc>=1.8",
  "mido>=1.3",
  "textual>=0.60",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6", "python-rtmidi>=1.5"]
m8 = ["pyserial>=3.5"]
yamnet = ["tflite-runtime; platform_machine != 'arm64'", "tensorflow; platform_machine == 'arm64'"]
dev = ["pytest>=8"]

[project.scripts]
roomtone = "roomtone.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["roomtone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
